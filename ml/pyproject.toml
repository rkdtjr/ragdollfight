[project]
name = "ragdollfight-ml"
version = "0.1.0"
requires-python = "==3.10.12"
dependencies = [
    "mlagents==1.1.0",
    "torch==2.2.2",
    "setuptools<70",  # mlagents uses pkg_resources
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
