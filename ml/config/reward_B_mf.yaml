# 보상 비교 실험 B: 유도 보상(접근·잡기·밀어내기·안전 영역 복귀) + 동시 낙하 -0.5
behaviors:
  Fighter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 3000000
    time_horizon: 256
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 5

env_settings:
  env_path: C:/Users/m0105/AppData/Local/ragdollfight/env_b/RagdollTrain  # gRPC DLL이 한글 경로에서 안 열려서 영문 경로에 둔다
  num_envs: 4
  env_args: ["-arenas", "8", "-shaping", "1", "-mutualFall", "-0.5"]

engine_settings:
  no_graphics: true
  time_scale: 20
  target_frame_rate: -1
